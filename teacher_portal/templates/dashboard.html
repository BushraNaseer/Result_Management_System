<!DOCTYPE html>
<html>
<head>
    <title>Teacher Dashboard</title>
    <style>
        body {
            margin:0;
            font-family: 'Segoe UI', sans-serif;
            background:#f4f6f9;
        }

        .navbar {
            background:#2f6fb2;
            color:white;
            padding:15px 30px;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        .navbar h2 {
            margin:0;
        }

        .logout-btn {
            background:#ff4d4d;
            border:none;
            padding:8px 14px;
            color:white;
            border-radius:6px;
            cursor:pointer;
        }

        .container {
            padding:30px;
        }

        .cards {
            display:grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap:20px;
        }

        .card {
            background:white;
            padding:20px;
            border-radius:10px;
            box-shadow:0 6px 20px rgba(0,0,0,0.1);
            transition:transform 0.3s;
        }

        .card:hover {
            transform:translateY(-5px);
        }

        .card h4 {
            margin-bottom:10px;
        }

        .card p {
            color:#555;
            font-size:14px;
        }
    </style>
</head>
<body>

<div class="navbar">
    <h2>Welcome, {{ request.user.username }}</h2>
    <form method="POST" action="{% url 'logout' %}">
        {% csrf_token %}
        <button class="logout-btn" type="submit">Logout</button>
    </form>
</div>

<div class="container">
    <h3>Dashboard</h3>

    <div class="cards">
        <div class="card">
            <h4>Upload Results</h4>
            <p>Add or update student results</p>
        </div>
        <div class="card">
            <h4>View Results</h4>
            <p>Check uploaded results</p>
        </div>
        <div class="card">
            <h4>Profile</h4>
            <p>View your personal info</p>
        </div>
    </div>
</div>

</body>
</html>
