<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Teacher Portal Login</title>
    <style>
        /* Reset & font */
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #74ebd5, #ACB6E5);
            overflow: hidden;
            position: relative;
        }

        /* Floating background circles */
        .circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255,255,255,0.15);
            animation: float 10s infinite ease-in-out;
        }

        .circle:nth-child(1) { width: 300px; height: 300px; top: -100px; left: -100px; animation-duration:12s; }
        .circle:nth-child(2) { width: 200px; height: 200px; bottom: -50px; right: -50px; animation-duration:15s; }
        .circle:nth-child(3) { width: 150px; height: 150px; top: 20%; right: 20%; animation-duration:18s; }

        @keyframes float {
            0%,100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(30px) rotate(15deg); }
        }

        /* Login box */
        .login-container {
            background-color: rgba(255,255,255,0.95);
            padding: 40px 35px;
            border-radius: 12px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
            width: 360px;
            position: relative;
            z-index: 1;
            opacity: 0;
            transform: translateY(-30px);
            animation: fadeSlide 1s forwards;
        }

        @keyframes fadeSlide {
            to { opacity:1; transform:translateY(0);}
        }

        .login-container h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
            letter-spacing:1px;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px;
            margin: 10px 0 20px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: #4a90e2;
            box-shadow: 0 0 10px rgba(74,144,226,0.6);
            outline: none;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #4a90e2;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            overflow: hidden;
            position: relative;
            transition: all 0.3s ease;
        }

        button:hover {
            background-color: #357ABD;
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(53,122,189,0.4);
        }

        /* Ripple effect */
        button:after {
            content:"";
            position:absolute;
            width:100px;
            height:100px;
            background: rgba(255,255,255,0.3);
            border-radius:50%;
            opacity:0;
            pointer-events:none;
            transform: scale(1);
            animation: ripple 0.6s linear;
        }

        button:active:after {
            opacity:1;
            transform: scale(0);
        }

        @keyframes ripple {
            to { opacity:0; transform: scale(4);}
        }

        .footer-link {
            display:block;
            text-align:center;
            margin-top:15px;
            color:#4a90e2;
            text-decoration:none;
            font-size:14px;
            transition:color 0.3s;
        }

        .footer-link:hover {
            color:#357ABD;
            text-decoration:underline;
        }

        @media(max-width:400px) {
            .login-container { width:90%; padding:30px 25px;}
        }

        .error-message {
            background: #ffe6e6;
            color: #b30000;
            padding: 10px;
            margin-top: 15px;
            margin-bottom: 15px;
            border-radius: 6px;
            font-size: 14px;
            text-align: center;
       }
    </style>
</head>
<body>
    <!-- Floating circles -->
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>

    <div class="login-container">
        <h2>Teacher Portal Login</h2>
        <form method="POST">
            {% csrf_token %}
            <input type="text" name="username" placeholder="Username" required />
            <input type="password" name="password" placeholder="Password" required />
            <button type="submit">Login</button>
        </form>
        {% if messages %}
            {% for message in messages %}
                <div class="error-message">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
        <a href="{% url 'teacher_portal:register' %}" class="footer-link">Don't have an account? Register</a>
    </div>
</body>
</html>
