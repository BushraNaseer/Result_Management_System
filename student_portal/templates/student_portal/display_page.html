<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Result Portal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            width: 400px;
        }
        h2 {
            text-align: center;
            margin-bottom: 25px;
        }
        input[type="number"] {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }
        button {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        button:hover {
            background: #5a67d8;
        }
        .error {
            color: red;
            margin-bottom: 15px;
            text-align: center;
        }
        .note {
            font-size: 12px;
            color: #555;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Student Result Portal</h2>

    <!-- Error message -->
    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <!-- Roll number form -->
    <form method="POST">
        {% csrf_token %}
        <input type="number" name="rollno" placeholder="Enter Roll Number" required>
        <button type="submit">Search</button>
    </form>

    <div class="note">
        Enter your roll number exactly as saved in the admin panel.
    </div>
</div>

</body>
</html>
